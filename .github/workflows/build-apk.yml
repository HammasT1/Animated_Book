name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "assets/readme/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish GitHub Releases on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Rename APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$OUT/app-release.apk"             "dist/AnimatedBook-v${VERSION}-universal.apk"
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/AnimatedBook-v${VERSION}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/AnimatedBook-v${VERSION}-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "dist/AnimatedBook-v${VERSION}-x86_64.apk"
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimatedBook-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
