<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Reader settings: the page cycles through light, sepia and dark paper while the text size grows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1613"/>
      <stop offset="0.6" stop-color="#2C2420"/>
      <stop offset="1" stop-color="#3E2A1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.27" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#CBB69B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#CBB69B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pageClip"><rect x="70" y="50" width="400" height="280" rx="16"/></clipPath>
    <style>
      .paper { animation: paper 9s ease-in-out infinite; }
      @keyframes paper { 0%,28% { fill: #FFFFFF; } 33%,61% { fill: #F6EEDC; } 66%,94% { fill: #2C2520; } 100% { fill: #FFFFFF; } }
      .ink { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; animation: ink 9s ease-in-out infinite; }
      @keyframes ink { 0%,28% { fill: #3A3633; } 33%,61% { fill: #5B4636; } 66%,94% { fill: #D5CFC9; } 100% { fill: #3A3633; } }
      .cap { font-family: Georgia, serif; font-weight: 700; font-size: 54px; animation: cap 9s ease-in-out infinite; }
      @keyframes cap { 0%,28% { fill: #6B4423; } 33%,61% { fill: #7A4E2A; } 66%,94% { fill: #CBB69B; } 100% { fill: #6B4423; } }
      .meta { font-family: Georgia, serif; font-size: 11px; letter-spacing: 2.5px; fill: #8B7355; }
      .grow { transform-box: fill-box; transform-origin: left top; animation: grow 9s ease-in-out infinite; }
      @keyframes grow { 0%,8% { transform: scale(1); } 18%,78% { transform: scale(1.1); } 88%,100% { transform: scale(1); } }
      .seg { animation: seg 9s cubic-bezier(.6,0,.2,1) infinite; }
      @keyframes seg { 0%,28% { transform: translateX(0); } 33%,61% { transform: translateX(118px); } 66%,94% { transform: translateX(236px); } 100% { transform: translateX(0); } }
      .knob { animation: knob 9s ease-in-out infinite; }
      @keyframes knob { 0%,8% { transform: translateX(0); } 18%,78% { transform: translateX(130px); } 88%,100% { transform: translateX(0); } }
      .trackfill { transform-box: fill-box; transform-origin: left center; animation: trackfill 9s ease-in-out infinite; }
      @keyframes trackfill { 0%,8% { transform: scaleX(1); } 18%,78% { transform: scaleX(2.6); } 88%,100% { transform: scaleX(1); } }
      .label { font-family: Georgia, serif; font-size: 11px; letter-spacing: 2.5px; fill: #CBB69B; }
      .opt { font-family: Georgia, serif; font-size: 14px; fill: #FAF8F3; }
      .title { font-family: Georgia, serif; font-size: 21px; font-weight: 700; fill: #FAF8F3; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
  </defs>

  <rect width="1000" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="380" rx="24" fill="url(#glow)"/>

  <!-- The page -->
  <g class="float">
    <rect x="74" y="58" width="400" height="280" rx="16" fill="#000" opacity="0.35"/>
    <rect class="paper" x="70" y="50" width="400" height="280" rx="16"/>
    <g clip-path="url(#pageClip)">
      <text x="270" y="80" text-anchor="middle" class="meta">THE SECRET GARDEN</text>
      <rect x="428" y="50" width="14" height="38" rx="3" fill="#E57373"/>
      <g class="grow">
        <text x="98" y="148" class="cap">W</text>
        <text x="150" y="118" class="ink">hen Mary Lennox was sent to</text>
        <text x="150" y="142" class="ink">Misselthwaite Manor to live</text>
        <text x="98" y="170" class="ink">with her uncle, everybody said she</text>
        <text x="98" y="194" class="ink">was the most disagreeable-looking</text>
        <text x="98" y="218" class="ink">child ever seen. It was true, too.</text>
        <text x="98" y="242" class="ink">She had a little thin face and a</text>
        <text x="98" y="266" class="ink">little thin body and a sour look…</text>
      </g>
      <text x="270" y="316" text-anchor="middle" class="meta">PAGE 1 OF 3</text>
    </g>
  </g>

  <!-- The settings panel -->
  <rect x="520" y="50" width="410" height="280" rx="16" fill="#26211D" stroke="#4A3B30"/>
  <text x="548" y="90" class="title">Aa  <tspan font-weight="400" font-size="17" fill="#CBB69B">Reading settings</tspan></text>

  <text x="548" y="126" class="label">PAPER</text>
  <rect x="548" y="136" width="354" height="40" rx="20" fill="none" stroke="#5D4037"/>
  <rect class="seg" x="550" y="138" width="114" height="36" rx="18" fill="#6B4423"/>
  <circle cx="584" cy="156" r="6" fill="#FFFFFF" stroke="#00000040"/>
  <text x="596" y="161" class="opt">Light</text>
  <circle cx="700" cy="156" r="6" fill="#F6EEDC" stroke="#00000040"/>
  <text x="712" y="161" class="opt">Sepia</text>
  <circle cx="820" cy="156" r="6" fill="#2C2520" stroke="#CBB69B80"/>
  <text x="832" y="161" class="opt">Dark</text>

  <text x="548" y="210" class="label">TEXT SIZE</text>
  <text x="548" y="238" font-family="Georgia, serif" font-size="13" fill="#CBB69B">A</text>
  <rect x="572" y="231" width="300" height="4" rx="2" fill="#4A3B30"/>
  <rect class="trackfill" x="572" y="231" width="70" height="4" rx="2" fill="#CBB69B"/>
  <circle class="knob" cx="642" cy="233" r="10" fill="#FAF8F3" stroke="#6B4423" stroke-width="3"/>
  <text x="884" y="241" font-family="Georgia, serif" font-size="21" fill="#CBB69B">A</text>

  <text x="548" y="272" class="label">TYPEFACE</text>
  <rect x="548" y="282" width="120" height="34" rx="17" fill="#6B4423"/>
  <text x="608" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#FAF8F3">Serif</text>
  <rect x="678" y="282" width="120" height="34" rx="17" fill="none" stroke="#5D4037"/>
  <text x="738" y="304" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="14" fill="#CBB69B">Sans</text>
</svg>
