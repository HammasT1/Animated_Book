<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B4423" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B7355"/>
      <stop offset="1" stop-color="#6B4423" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CBB69B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FAF8F3"/>
      <stop offset="1" stop-color="#CBB69B" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sweep { animation: sweep 4s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-260px); } 100% { transform: translateX(1200px); } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(45deg) scale(1.35); } }
    </style>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#g)"/>
  <rect class="sweep" x="0" y="11" width="260" height="2" fill="url(#s)"/>
  <rect class="pulse" x="594" y="6" width="12" height="12" fill="#6B4423" stroke="#CBB69B" stroke-width="1.5"/>
</svg>
