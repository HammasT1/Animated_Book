<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Keyboard shortcuts: arrow keys, Space, Page Up and Page Down turn pages, B bookmarks, Esc closes, and the scroll wheel turns pages at the edge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1613"/>
      <stop offset="0.6" stop-color="#2C2420"/>
      <stop offset="1" stop-color="#3E2A1C"/>
    </linearGradient>
    <style>
      .key { animation: press 8s ease-in-out infinite; }
      @keyframes press { 0%,100% { transform: translateY(0); } 2%,8% { transform: translateY(5px); } 11% { transform: translateY(0); } }
      .cap { animation: lit 8s ease-in-out infinite; }
      @keyframes lit { 0%,100% { fill: #2C2420; stroke: #8B7355; } 2%,8% { fill: #6B4423; stroke: #FFC107; } 12% { fill: #2C2420; stroke: #8B7355; } }
      .lbl { font-family: Georgia, serif; font-size: 20px; font-weight: 700; fill: #FAF8F3; }
      .cap-txt { font-family: Georgia, serif; font-size: 13px; font-style: italic; fill: #CBB69B; }
      .wheel { animation: wheel 1.6s ease-in-out infinite; }
      @keyframes wheel { 0%,100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(8px); opacity: .4; } }
    </style>
  </defs>

  <rect width="1000" height="210" rx="24" fill="url(#bg)"/>

  <!-- Each key: shadow, then a pressable cap. Delays step through the row. -->
  <g transform="translate(90 50)">
    <rect y="6" width="60" height="56" rx="10" fill="#0E0B09"/>
    <g class="key" style="animation-delay:0s"><rect class="cap" fill="#2C2420" stroke="#8B7355" style="animation-delay:0s" width="60" height="56" rx="10" stroke-width="2"/><text x="30" y="36" text-anchor="middle" class="lbl" style="font-size:30px">←</text></g>
    <text x="30" y="100" text-anchor="middle" class="cap-txt">previous</text>
  </g>
  <g transform="translate(174 50)">
    <rect y="6" width="60" height="56" rx="10" fill="#0E0B09"/>
    <g class="key" style="animation-delay:1s"><rect class="cap" fill="#2C2420" stroke="#8B7355" style="animation-delay:1s" width="60" height="56" rx="10" stroke-width="2"/><text x="30" y="36" text-anchor="middle" class="lbl" style="font-size:30px">→</text></g>
    <text x="30" y="100" text-anchor="middle" class="cap-txt">next</text>
  </g>
  <g transform="translate(258 50)">
    <rect y="6" width="170" height="56" rx="10" fill="#0E0B09"/>
    <g class="key" style="animation-delay:2s"><rect class="cap" fill="#2C2420" stroke="#8B7355" style="animation-delay:2s" width="170" height="56" rx="10" stroke-width="2"/><text x="85" y="35" text-anchor="middle" class="lbl" style="font-size:17px">Space</text></g>
    <text x="85" y="100" text-anchor="middle" class="cap-txt">next · ⇧ previous</text>
  </g>
  <g transform="translate(452 50)">
    <rect y="6" width="80" height="56" rx="10" fill="#0E0B09"/>
    <g class="key" style="animation-delay:3s"><rect class="cap" fill="#2C2420" stroke="#8B7355" style="animation-delay:3s" width="80" height="56" rx="10" stroke-width="2"/><text x="40" y="35" text-anchor="middle" class="lbl" style="font-size:17px">PgUp</text></g>
    <text x="40" y="100" text-anchor="middle" class="cap-txt">previous</text>
  </g>
  <g transform="translate(556 50)">
    <rect y="6" width="80" height="56" rx="10" fill="#0E0B09"/>
    <g class="key" style="animation-delay:4s"><rect class="cap" fill="#2C2420" stroke="#8B7355" style="animation-delay:4s" width="80" height="56" rx="10" stroke-width="2"/><text x="40" y="35" text-anchor="middle" class="lbl" style="font-size:17px">PgDn</text></g>
    <text x="40" y="100" text-anchor="middle" class="cap-txt">next</text>
  </g>
  <g transform="translate(660 50)">
    <rect y="6" width="60" height="56" rx="10" fill="#0E0B09"/>
    <g class="key" style="animation-delay:5s"><rect class="cap" fill="#2C2420" stroke="#8B7355" style="animation-delay:5s" width="60" height="56" rx="10" stroke-width="2"/><text x="30" y="36" text-anchor="middle" class="lbl">B</text></g>
    <text x="30" y="100" text-anchor="middle" class="cap-txt">bookmark</text>
  </g>
  <g transform="translate(744 50)">
    <rect y="6" width="70" height="56" rx="10" fill="#0E0B09"/>
    <g class="key" style="animation-delay:6s"><rect class="cap" fill="#2C2420" stroke="#8B7355" style="animation-delay:6s" width="70" height="56" rx="10" stroke-width="2"/><text x="35" y="35" text-anchor="middle" class="lbl" style="font-size:17px">Esc</text></g>
    <text x="35" y="100" text-anchor="middle" class="cap-txt">close</text>
  </g>

  <!-- Mouse -->
  <g transform="translate(860 44)">
    <rect width="48" height="70" rx="24" fill="#2C2420" stroke="#8B7355" stroke-width="2"/>
    <line x1="24" y1="0" x2="24" y2="26" stroke="#8B7355" stroke-width="2"/>
    <rect class="wheel" x="20" y="10" width="8" height="14" rx="4" fill="#FFC107"/>
    <text x="24" y="106" text-anchor="middle" class="cap-txt">wheel at edge</text>
  </g>

  <text x="500" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2.5" fill="#8B7355">LIBRARY: ← → TO BROWSE · ENTER TO OPEN</text>
</svg>
