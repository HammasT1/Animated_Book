<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="App colour palette">
  <style>
    .sw { animation: pop .7s cubic-bezier(.2,.8,.2,1.2) both; transform-box: fill-box; transform-origin: center bottom; }
    @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.9); } to { opacity: 1; transform: none; } }
    .name { font-family: Georgia, serif; font-size: 16px; font-weight: 700; fill: #8B7355; }
    .hex  { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; fill: #8B7355; }
  </style>
  <g class="sw" style="animation-delay:0s">
    <rect x="10"  y="10" width="110" height="110" rx="18" fill="#6B4423"/>
    <text x="65"  y="150" text-anchor="middle" class="name">Leather</text><text x="65" y="172" text-anchor="middle" class="hex">#6B4423</text>
  </g>
  <g class="sw" style="animation-delay:.1s">
    <rect x="135" y="10" width="110" height="110" rx="18" fill="#8B7355"/>
    <text x="190" y="150" text-anchor="middle" class="name">Walnut</text><text x="190" y="172" text-anchor="middle" class="hex">#8B7355</text>
  </g>
  <g class="sw" style="animation-delay:.2s">
    <rect x="260" y="10" width="110" height="110" rx="18" fill="#5D4037"/>
    <text x="315" y="150" text-anchor="middle" class="name">Mocha</text><text x="315" y="172" text-anchor="middle" class="hex">#5D4037</text>
  </g>
  <g class="sw" style="animation-delay:.3s">
    <rect x="385" y="10" width="110" height="110" rx="18" fill="#CBB69B"/>
    <text x="440" y="150" text-anchor="middle" class="name">Sand</text><text x="440" y="172" text-anchor="middle" class="hex">#CBB69B</text>
  </g>
  <g class="sw" style="animation-delay:.4s">
    <rect x="510" y="10" width="110" height="110" rx="18" fill="#FAF8F3" stroke="#CBB69B" stroke-width="2"/>
    <text x="565" y="150" text-anchor="middle" class="name">Parchment</text><text x="565" y="172" text-anchor="middle" class="hex">#FAF8F3</text>
  </g>
  <g class="sw" style="animation-delay:.5s">
    <rect x="635" y="10" width="110" height="110" rx="18" fill="#2C2420"/>
    <text x="690" y="150" text-anchor="middle" class="name">Espresso</text><text x="690" y="172" text-anchor="middle" class="hex">#2C2420</text>
  </g>
  <g class="sw" style="animation-delay:.6s">
    <rect x="760" y="10" width="110" height="110" rx="18" fill="#1A1613"/>
    <text x="815" y="150" text-anchor="middle" class="name">Night</text><text x="815" y="172" text-anchor="middle" class="hex">#1A1613</text>
  </g>
  <g class="sw" style="animation-delay:.7s">
    <rect x="885" y="10" width="105" height="110" rx="18" fill="#FFC107"/>
    <text x="937" y="150" text-anchor="middle" class="name">Amber</text><text x="937" y="172" text-anchor="middle" class="hex">#FFC107</text>
  </g>
</svg>
